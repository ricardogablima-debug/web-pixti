<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIxTI® - Versión Expansiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;600&display=swap');
        
        /* Capa de fondo fija que abarca todo el sitio */
        .bg-expansivo {
            background-image: url('PIxTI 22_2.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        body { font-family: 'Inter', sans-serif; background-color: #f4eee0; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Efecto de cristal para legibilidad sobre el fondo */
        .glass-effect {
            background: rgba(244, 238, 224, 0.8);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>

    <!-- Fondo fijo -->
    <div class="bg-expansivo"></div>

    <!-- Botón de Idioma -->
    <nav class="fixed top-6 right-6 z-50">
        <button onclick="toggleLanguage()" class="bg-[#0f172a] text-white px-6 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest hover:bg-[#f59e0b] transition-all">
            ESP / ENG
        </button>
    </nav>

    <!-- Header -->
    <header class="h-screen flex flex-col items-center justify-center text-center px-6">
        <h1 class="font-serif text-7xl md:text-9xl font-bold italic mb-4 text-[#0f172a]">PIxTI®</h1>
        <p id="main-tagline" class="text-xl md:text-2xl font-serif italic text-gray-800 max-w-2xl">
            Principios isométricos para la Transformación Isotónica
        </p>
    </header>

    <!-- Sección de Cuadrantes -->
    <!-- SECCIÓN DE CUADRANTES: Va después del Header y antes del Formulario -->
<section class="max-w-7xl mx-auto px-6 grid md:grid-cols-4 gap-8 py-20">
    
    <!-- Cuadrante Fase 1 -->
    <div class="relative overflow-hidden rounded-[2.5rem] h-80 bg-white/30 border border-black/5 group cursor-pointer shadow-lg">
        <div class="absolute inset-0 flex items-center justify-center">
            <span class="font-serif italic text-3xl text-[#f59e0b]" id="lbl-fase1">Fase 1</span>
        </div>
        <div class="absolute inset-0 glass-effect p-8 translate-y-full group-hover:translate-y-0 transition-transform duration-700 ease-in-out flex flex-col justify-center">
            <h3 class="font-bold text-xs uppercase tracking-widest mb-3 text-[#0f172a]" id="tit-fase1">Isometría</h3>
            <p class="text-sm text-gray-700 leading-relaxed" id="desc-fase1">Texto pendiente...</p>
        </div>
    </div>

    <!-- Cuadrante Fase 2 -->
    <div class="relative overflow-hidden rounded-[2.5rem] h-80 bg-white/30 border border-black/5 group cursor-pointer shadow-lg">
        <div class="absolute inset-0 flex items-center justify-center">
            <span class="font-serif italic text-3xl text-[#f59e0b]" id="lbl-fase2">Fase 2</span>
        </div>
        <div class="absolute inset-0 glass-effect p-8 translate-y-full group-hover:translate-y-0 transition-transform duration-700 ease-in-out flex flex-col justify-center">
            <h3 class="font-bold text-xs uppercase tracking-widest mb-3 text-[#0f172a]" id="tit-fase2">Activación</h3>
            <p class="text-sm text-gray-700 leading-relaxed" id="desc-fase2">Texto pendiente...</p>
        </div>
    </div>

    <!-- Cuadrante Fase 3 -->
    <div class="relative overflow-hidden rounded-[2.5rem] h-80 bg-white/30 border border-black/5 group cursor-pointer shadow-lg">
        <div class="absolute inset-0 flex items-center justify-center">
            <span class="font-serif italic text-3xl text-[#f59e0b]" id="lbl-fase3">Fase 3</span>
        </div>
        <div class="absolute inset-0 glass-effect p-8 translate-y-full group-hover:translate-y-0 transition-transform duration-700 ease-in-out flex flex-col justify-center">
            <h3 class="font-bold text-xs uppercase tracking-widest mb-3 text-[#0f172a]" id="tit-fase3">Inserción</h3>
            <p class="text-sm text-gray-700 leading-relaxed" id="desc-fase3">Texto pendiente...</p>
        </div>
    </div>

    <!-- Cuadrante Fase 4 -->
    <div class="relative overflow-hidden rounded-[2.5rem] h-80 bg-white/30 border border-black/5 group cursor-pointer shadow-lg">
        <div class="absolute inset-0 flex items-center justify-center">
            <span class="font-serif italic text-3xl text-[#f59e0b]" id="lbl-fase4">Fase 4</span>
        </div>
        <div class="absolute inset-0 glass-effect p-8 translate-y-full group-hover:translate-y-0 transition-transform duration-700 ease-in-out flex flex-col justify-center">
            <h3 class="font-bold text-xs uppercase tracking-widest mb-3 text-[#0f172a]" id="tit-fase4">Movilidad</h3>
            <p class="text-sm text-gray-700 leading-relaxed" id="desc-fase4">Texto pendiente...</p>
        </div>
    </div>

</section>
        <!-- Generación de los 4 bloques con ID para traducción -->
        <div class="relative overflow-hidden rounded-[2.5rem] h-80 bg-white/30 border border-black/5 group cursor-pointer shadow-lg">
            <div class="absolute inset-0 flex items-center justify-center">
                <span class="font-serif italic text-3xl text-[#f59e0b]" id="lbl-fase1">Fase 1</span>
            </div>
            <!-- El panel que se desliza hacia arriba -->
            <div class="absolute inset-0 glass-effect p-8 translate-y-full group-hover:translate-y-0 transition-transform duration-700 ease-in-out flex flex-col justify-center">
                <h3 class="font-bold text-xs uppercase tracking-widest mb-3 text-[#0f172a]" id="tit-fase1">Isometría</h3>
                <p class="text-sm text-gray-700 leading-relaxed" id="desc-fase1">Contenido en espera de definición...</p>
            </div>
        </div>
        <!-- (Repetir para las otras 3 fases con IDs correlativos: lbl-fase2, tit-fase2, etc.) -->
    </section>

    <!-- Formulario de Contacto -->
    <section class="glass-effect py-24 px-6 rounded-t-[4rem]">
        <div class="max-w-4xl mx-auto">
            <h2 id="contact-title" class="font-serif text-5xl mb-12 italic text-center text-[#0f172a]">Contacto Profesional</h2>
            <form class="grid md:grid-cols-2 gap-8">
                <input type="text" id="form-name" placeholder="Nombre y Apellido" class="bg-transparent border-b border-black/20 py-4 outline-none focus:border-[#f59e0b]">
                <input type="tel" id="form-phone" placeholder="Celular" class="bg-transparent border-b border-black/20 py-4 outline-none focus:border-[#f59e0b]">
                <input type="email" id="form-email" placeholder="Email" class="bg-transparent border-b border-black/20 py-4 outline-none focus:border-[#f59e0b]">
                <input type="text" id="form-country" placeholder="País" class="bg-transparent border-b border-black/20 py-4 outline-none focus:border-[#f59e0b]">
                <textarea id="form-msg" placeholder="Mensaje" class="md:col-span-2 bg-transparent border-b border-black/20 py-4 h-32 outline-none focus:border-[#f59e0b]"></textarea>
                <button id="form-submit" class="md:col-span-2 bg-[#f59e0b] text-[#0f172a] font-bold py-6 rounded-2xl uppercase text-xs tracking-[0.3em] hover:bg-[#0f172a] hover:text-white transition-all">
                    Enviar Solicitud
                </button>
            </form>
        </div>
    </section>

    <script>
        let currentLang = 'esp';
        const langData = {
            esp: {
                tagline: "Principios isométricos para la Transformación Isotónica",
                f1: "Fase 1", t1: "Isometría", d1: "Texto en espera...",
                contact: "Contacto Profesional", name: "Nombre y Apellido",
                phone: "Celular", country: "País", msg: "Mensaje", btn: "Enviar Solicitud"
            },
            eng: {
                tagline: "Isometric Principles for Isotonic Transformation",
                f1: "Phase 1", t1: "Isometrics", d1: "Pending content...",
                contact: "Professional Contact", name: "Full Name",
                phone: "Mobile", country: "Country", msg: "Message", btn: "Send Request"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'esp' ? 'eng' : 'esp';
            const data = langData[currentLang];
            document.getElementById('main-tagline').innerText = data.tagline;
            document.getElementById('lbl-fase1').innerText = data.f1;
            document.getElementById('tit-fase1').innerText = data.t1;
            document.getElementById('desc-fase1').innerText = data.d1;
            document.getElementById('contact-title').innerText = data.contact;
            document.getElementById('form-name').placeholder = data.name;
            document.getElementById('form-phone').placeholder = data.phone;
            document.getElementById('form-country').placeholder = data.country;
            document.getElementById('form-msg').placeholder = data.msg;
            document.getElementById('form-submit').innerText = data.btn;
        }
    </script>
</body>
</html>
